name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Bauen und testen mit dem Compiler und der libc der jeweiligen Distribution.
  # dbus-daemon und PyGObject sind fuer tests/dbus.sh; --privileged erlaubt
  # dessen Netzteil-Tests (Mount-Namespace).
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Arch Linux
            image: archlinux:latest
            setup: pacman -Syu --noconfirm --needed gcc make dbus python-gobject
          - name: Debian stable
            image: debian:stable
            setup: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y gcc libc6-dev make dbus python3-gi
          - name: Debian oldstable
            image: debian:oldstable
            setup: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y gcc libc6-dev make dbus python3-gi
          - name: Ubuntu 22.04
            image: ubuntu:22.04
            setup: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y gcc libc6-dev make dbus python3-gi
          - name: Fedora (clang)
            image: fedora:latest
            setup: dnf install -y clang make dbus-daemon python3-gobject-base
            cc: clang
          - name: Rocky Linux 8 (Kernel-Header 4.18)
            image: rockylinux:8
            setup: dnf install -y gcc make dbus-daemon python3-gobject-base python36
          - name: openSUSE Tumbleweed
            image: opensuse/tumbleweed:latest
            setup: zypper -n install gcc make dbus-1-daemon python3-gobject
          - name: Alpine (musl)
            image: alpine:latest
            setup: apk add --no-cache build-base dbus py3-gobject3
    steps:
      - uses: actions/checkout@v4
      - name: Bauen und testen
        run: |
          docker run --rm --privileged -v "$PWD:/src" -w /src ${{ matrix.image }} sh -c \
            '${{ matrix.setup }} && make CC=${{ matrix.cc || 'cc' }} && make test'

  # Statisches Binary (musl), das ohne Installation auf jeder Distribution laeuft.
  static:
    name: Statisches Binary (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Bauen (Alpine, musl)
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:latest sh -c \
            'apk add --no-cache build-base && make static && cp caffeinate caffeinate-${{ matrix.arch }}-linux'
      - name: Auf anderen Distributionen starten
        run: |
          for image in debian:oldstable ubuntu:20.04 rockylinux:8 fedora:latest; do
            echo "== $image"
            docker run --rm -v "$PWD:/src" -w /src "$image" sh tests/smoke.sh ./caffeinate-${{ matrix.arch }}-linux
          done
      - uses: actions/upload-artifact@v4
        with:
          name: caffeinate-${{ matrix.arch }}-linux
          path: caffeinate-${{ matrix.arch }}-linux
          if-no-files-found: error

  # Bei einem Tag v* die Binaries an ein Release haengen.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, static]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x caffeinate-*-linux
          sha256sum caffeinate-*-linux > SHA256SUMS
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber caffeinate-*-linux SHA256SUMS
